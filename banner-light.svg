<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <clipPath id="mbot-clip">
      <circle cx="100" cy="100" r="70"/>
    </clipPath>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="#f6f8fa" rx="6"/>
  
  <!-- Subtle circuit pattern -->
  <pattern id="circuit" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M0 20h15m10 0h15M20 0v15m0 10v15" fill="none" stroke="#e1e4e8" stroke-width="0.5"/>
    <circle cx="20" cy="20" r="2" fill="#e1e4e8"/>
  </pattern>
  <rect width="800" height="200" fill="url(#circuit)" opacity="0.3"/>
  
  <!-- mBot Image -->
  <circle cx="100" cy="100" r="72" fill="#0969da"/>
  <image href="https://raw.githubusercontent.com/jorbencas/jorbencas/master/mbot.jpg" x="30" y="30" width="140" height="140" clip-path="url(#mbot-clip)"/>
  
  <!-- Name -->
  <text x="220" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#24292f">Jorge Beneyto Castelló</text>
  
  <!-- Title -->
  <text x="220" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#57606a">Full Stack Developer</text>
  
  <!-- Tech tags -->
  <rect x="220" y="125" width="60" height="24" rx="12" fill="#0969da"/>
  <text x="250" y="141" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="white" text-anchor="middle">Python</text>
  
  <rect x="290" y="125" width="70" height="24" rx="12" fill="#0969da"/>
  <text x="325" y="141" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="white" text-anchor="middle">Docker</text>
  
  <rect x="370" y="125" width="80" height="24" rx="12" fill="#0969da"/>
  <text x="410" y="141" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="white" text-anchor="middle">TypeScript</text>
  
  <rect x="460" y="125" width="70" height="24" rx="12" fill="#0969da"/>
  <text x="495" y="141" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="white" text-anchor="middle">React</text>
  
  <!-- Decorative elements -->
  <circle cx="700" cy="40" r="30" fill="#0969da" opacity="0.1"/>
  <circle cx="750" cy="160" r="20" fill="#0969da" opacity="0.1"/>
  <circle cx="650" cy="150" r="15" fill="#0969da" opacity="0.1"/>
  
  <!-- Code bracket decoration -->
  <text x="680" y="90" font-family="monospace" font-size="40" fill="#0969da" opacity="0.2">&lt;/&gt;</text>
</svg>