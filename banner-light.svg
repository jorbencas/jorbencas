<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <clipPath id="photo-clip">
      <circle cx="100" cy="100" r="60"/>
    </clipPath>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="#f6f8fa" rx="6"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e1e4e8" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="200" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Photo -->
  <circle cx="100" cy="100" r="62" fill="#0969da"/>
  <image href="https://avatars.githubusercontent.com/u/24507024?v=4" x="40" y="40" width="120" height="120" clip-path="url(#photo-clip)"/>
  
  <!-- Name -->
  <text x="200" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#24292f">Jorge Beneyto Castelló</text>
  
  <!-- Title -->
  <text x="200" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#57606a">Full Stack Developer</text>
  
  <!-- Tech tags -->
  <rect x="200" y="125" width="60" height="24" rx="12" fill="#0969da"/>
  <text x="230" y="141" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="white" text-anchor="middle">Python</text>
  
  <rect x="270" y="125" width="70" height="24" rx="12" fill="#0969da"/>
  <text x="305" y="141" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="white" text-anchor="middle">Docker</text>
  
  <rect x="350" y="125" width="80" height="24" rx="12" fill="#0969da"/>
  <text x="390" y="141" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="white" text-anchor="middle">TypeScript</text>
  
  <rect x="440" y="125" width="70" height="24" rx="12" fill="#0969da"/>
  <text x="475" y="141" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="white" text-anchor="middle">React</text>
  
  <!-- Decorative elements -->
  <circle cx="700" cy="40" r="30" fill="#0969da" opacity="0.1"/>
  <circle cx="750" cy="160" r="20" fill="#0969da" opacity="0.1"/>
  <circle cx="650" cy="150" r="15" fill="#0969da" opacity="0.1"/>
  
  <!-- Code bracket decoration -->
  <text x="680" y="90" font-family="monospace" font-size="40" fill="#0969da" opacity="0.2">&lt;/&gt;</text>
</svg>