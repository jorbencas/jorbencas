name: Update README with Blog Posts
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pull RSS Feed
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://blog-jorbencas.vercel.app/rss.xml"
          max_post_count: 5
          commit_message: "[blog] update latest blog posts in README"
          committer_name: "GitHub Actions"
          committer_email: "actions@github.com"
